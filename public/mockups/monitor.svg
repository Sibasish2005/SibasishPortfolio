<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" fill="none">
  <defs>
    <linearGradient id="monitorBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <mask id="screenCutout">
      <rect width="1000" height="640" fill="white"/>
      <rect x="56" y="36" width="888" height="476" rx="6" fill="black"/>
    </mask>
  </defs>
  <!-- Stand Neck -->
  <path d="M460 520 L540 520 L555 600 L445 600 Z" fill="url(#standGrad)" stroke="#333" stroke-width="1.5"/>
  <!-- Stand Base -->
  <rect x="360" y="598" width="280" height="12" rx="4" fill="#1e1e1e" stroke="#444" stroke-width="1.5"/>
  <rect x="400" y="610" width="200" height="4" rx="2" fill="#000" opacity="0.3"/>
  <!-- Monitor Outer Body (cutout mask ensures screen aperture is 100% transparent) -->
  <rect x="40" y="20" width="920" height="510" rx="14" fill="url(#monitorBezel)" stroke="#383838" stroke-width="2" mask="url(#screenCutout)"/>
  <!-- Inner Bezel border -->
  <rect x="56" y="36" width="888" height="476" rx="6" fill="none" stroke="#222" stroke-width="1"/>
  <!-- Webcam Dot -->
  <circle cx="500" cy="28" r="3" fill="#222" stroke="#444" stroke-width="1"/>
  <circle cx="500" cy="28" r="1" fill="#00FF66" opacity="0.8"/>
</svg>