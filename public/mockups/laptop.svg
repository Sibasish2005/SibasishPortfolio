<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" fill="none">
  <defs>
    <linearGradient id="laptopLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="laptopBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#383838"/>
      <stop offset="60%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
    <mask id="laptopScreenCutout">
      <rect width="1000" height="620" fill="white"/>
      <rect x="106" y="40" width="788" height="478" rx="8" fill="black"/>
    </mask>
  </defs>
  <!-- Laptop Display Lid (cutout mask ensures screen aperture is 100% transparent) -->
  <rect x="90" y="24" width="820" height="510" rx="16" fill="url(#laptopLid)" stroke="#444" stroke-width="2" mask="url(#laptopScreenCutout)"/>
  <!-- Screen Inset -->
  <rect x="106" y="40" width="788" height="478" rx="8" fill="none" stroke="#262626" stroke-width="1.5"/>
  <!-- Camera notch / Dot -->
  <circle cx="500" cy="32" r="3" fill="#111" stroke="#333" stroke-width="1"/>
  <circle cx="500" cy="32" r="1" fill="#00F0FF" opacity="0.6"/>
  <!-- Laptop Base Chassis -->
  <path d="M20 534 L980 534 C990 534 998 542 995 552 L970 574 C966 578 960 580 954 580 L46 580 C40 580 34 578 30 574 L5 552 C2 542 10 534 20 534 Z" fill="url(#laptopBase)" stroke="#444" stroke-width="1.5"/>
  <!-- Trackpad Opening Indent -->
  <path d="M440 534 L560 534 L554 544 L446 544 Z" fill="#141414" stroke="#282828" stroke-width="1"/>
</svg>